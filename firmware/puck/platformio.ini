; Puck firmware. Pick the env matching the XIAO you were handed.
;   pio run -e xiao_c6 -t upload
; Local overrides (chain key, port) go in platformio.local.ini (gitignored):
;   [env]
;   build_flags = ${env.build_flags} -D CHAIN_KEY_HEX=\"00112233445566778899aabbccddeeff\"
;   upload_port = /dev/cu.usbmodem1101

[platformio]
default_envs = xiao_c6
extra_configs = platformio.local.ini

[env]
framework = arduino
monitor_speed = 115200
build_flags =
  -I ../common
  -D DEMO=1
lib_deps =
  jgromes/RadioLib @ ^7.1.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  https://github.com/Seeed-Studio/Accelerometer_MMA7660.git

; ESP32-C6 needs arduino-esp32 core 3.x, which the stock PlatformIO platform lacks.
; pioarduino's fork provides it.
[env:xiao_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6

[env:xiao_s3]
platform = espressif32
board = seeed_xiao_esp32s3

[env:xiao_c3]
platform = espressif32
board = seeed_xiao_esp32c3
