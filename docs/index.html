<pre>#include &lt;RH_RF95.h&gt;
#include &lt;Adafruit_BME680.h&gt;
#define CS 16
#define RST 17
#define IRQ 21
RH_RF95 rf95(CS, IRQ);
Adafruit_BME680 bme;
const char* ID = "P1";
void setup(){
