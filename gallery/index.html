<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team 21 at the Forge</title>
<style>body{margin:0;background:#0a0c10;color:#e6e9ef;font:16px/1.4 -apple-system,Helvetica,Arial,sans-serif}header{padding:28px 24px 8px}h1{margin:0;font-size:22px;font-weight:600}p{margin:6px 0 0;color:#9aa3b2}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:16px 24px 40px}.g a{display:block;background:#11151c;border-radius:8px;overflow:hidden}.g img{display:block;width:100%;height:240px;object-fit:cover}.g span{display:block;padding:10px 12px;color:#c7cdd8;font-size:14px}
#v{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center}#v.on{display:flex}#v img{max-width:96vw;max-height:94vh}</style></head><body>
<header><h1>Team 21 at the Forge</h1><p>Build photos, 7 to 8 November 2026, BASE-X Boston. Click a photo to view it full size.</p></header>
<div class="g" id="g"></div><div id="v" onclick="this.classList.remove('on')"><img id="vi" alt=""></div>
<script>const C=["Three demo dipcans, stacked, with a tin for scale.","Parts on the table before the first build.","The whiteboard: the Dude 44 Bravo chain, and the name spelled out.","Breadboards, Feather boards, and sensors mid-build.","Working the chain lifecycle at the board.","Lanes: puck firmware on one side, interrogator and ATAK on the other.","Antennas and sensors going on.","Team 21.","Code Metal Forge Hackathon 2026, sponsored by U.S. Special Operations Command."];
const g=document.getElementById('g');C.forEach((c,i)=>{const a=document.createElement('a');a.href=`hackathon-${i+1}.png`;a.innerHTML=`<img src="hackathon-${i+1}.png" alt="${c}"><span>${c}</span>`;a.onclick=e=>{e.preventDefault();document.getElementById('vi').src=a.href;document.getElementById('v').classList.add('on')};g.appendChild(a)});</script></body></html>
